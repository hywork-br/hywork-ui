name: Volta do hotfix para a develop

# Gitflow (HCK-440): o que entra na produção sem vir da develop (hotfix) volta sozinho para a
# develop, sem PR e sem ninguém aprovar. Num merge de release (develop → produção) não há nada a
# voltar, e o job termina sem fazer nada.
# Publica com a chave de deploy do repositório (segredo VOLTA_HOTFIX_SSH_KEY), a única exceção da regra
# "develop protegida". O push pela chave dispara o deploy de staging da develop, como um merge comum.
# Conflito: o job não força nada. Abre um PR produção → develop para alguém resolver e fica vermelho.

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Conflito: abre o PR produção → develop para alguém resolver.
  pull-requests: write

concurrency:
  group: volta-do-hotfix
  cancel-in-progress: false

jobs:
  volta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.VOLTA_HOTFIX_SSH_KEY }}

      - name: Merge da produção na develop
        env:
          GH_TOKEN: ${{ github.token }}
          PROD: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$PROD" develop
          git reset -q --hard origin/develop
          if git diff --quiet "origin/develop...origin/$PROD"; then
            echo "A $PROD não tem nada que a develop não tenha (release): nada a voltar."
            exit 0
          fi
          if git merge --no-ff --no-edit "origin/$PROD" -m "chore: volta do hotfix da $PROD para a develop (automática)"; then
            git push origin HEAD:develop
            echo "### Hotfix voltou para a develop ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort
            gh pr create --base develop --head "$PROD" --title "Volta do hotfix: conflito com a develop" \
              --body "O merge automático da $PROD na develop deu conflito. Resolva neste PR (HCK-440)." || true
            echo "::error::Conflito ao voltar o hotfix para a develop: PR aberto para resolver."
            exit 1
          fi
