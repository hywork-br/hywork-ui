name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Sem dependências: o check é Node puro, de propósito. Design system que
      # precisa de build pra validar token demora a rodar e para de ser rodado.
      - run: node scripts/check-tokens.mjs
