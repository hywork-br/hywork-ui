name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Sem dependências: o check é Node puro, de propósito. Design system que
      # precisa de build pra validar token demora a rodar e para de ser rodado.
      - run: node scripts/check-tokens.mjs
      # Gerado que não é verificado vira gerado que ninguém regenera.
      #
      # São DUAS pontes, e as duas saem da mesma fonte. Verificar só uma foi
      # como o tema do v4 ficou 34 tokens atrás da camada semântica sem que
      # nada acusasse — `@apply text-danger-fg` sem a entrada no @theme não
      # gera utility, não quebra o build e não aparece no lint.
      - run: node scripts/gerar-preset-v3.mjs --check
      - run: node scripts/gerar-tema-v4.mjs --check
      # O preset precisa carregar de verdade, não só existir.
      #
      # ⚠️ Bloco literal (`|`), e não escalar solto. Esta linha já derrubou o CI
      # inteiro uma vez: `'FAIL: preset…'` tem DOIS-PONTOS-ESPAÇO, que em YAML
      # não pode aparecer num escalar sem aspas — o arquivo fica inválido e o
      # GitHub responde com startup_failure: run de 0s, zero jobs, log
      # inexistente. Ou seja, a falha não se parece com "o check reprovou", se
      # parece com "o CI não existe" — e foi assim que três versões saíram sem
      # que uma única verificação rodasse. Dentro de `|` o conteúdo é texto
      # bruto e o problema não volta.
      - run: |
          node -e "const p = require('./tailwind/v3-preset.cjs'); if (!p.theme.extend.colors.primary) { console.error('FAIL: preset sem a cor primaria'); process.exit(1) }"
