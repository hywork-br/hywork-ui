name: checks
# Só no PR: todo código chega à develop e à main por PR já testado (minutos de Actions).
on:
  pull_request:

# Commit novo no mesmo PR cancela o run anterior: só o último importa (minutos de Actions).
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:consumer
      - run: npm run build
      - run: npm run audit:gate
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: platform-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
